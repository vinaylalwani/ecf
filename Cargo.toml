[package]
name = "ecf"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
uuid = { version = "1", features = ["serde", "v4"] }
reed-solomon-erasure = "6.0.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
hex = "0.4"
anyhow = "1.0"
alloy = { version = "0.3", features = ["full"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
